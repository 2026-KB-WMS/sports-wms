aspring.application.name=SportsWms
spring.messages.encoding=UTF-8

# MySQL DB connection
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.url=jdbc:mysql://localhost:3306/dummyDB?useSSL=false&useUnicode=true&serverTimezone=Asia/Seoul&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=root

# JPA ddl, Naming and log
spring.jpa.hibernate.ddl-auto=update
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
spring.jpa.show-sql=false

# Hibernate Statistics & StatementInspector
spring.jpa.properties.hibernate.generate_statistics=true
spring.jpa.properties.hibernate.session_factory.statement_inspector=com.example.sportswms.global.config.QueryCountingInspector

server.servlet.session.timeout=3600

# Kakao Local API (주소 -> 좌표 변환)
# 실제 키는 환경변수(KAKAO_API_KEY)로 주입. 절대 커밋되는 파일에 직접 값을 넣지 말 것.
kakao.geocoding.api-key=${KAKAO_API_KEY:}